plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.4.10'
    id 'application'
}
group = 'li.cil.vox2mc'
version = '0.0.1'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation "com.google.guava:guava:30.0-jre"
}

compileKotlin {
    kotlinOptions.jvmTarget = '11'
}
application {
    mainClassName = 'li.cil.vox2mc.MainKt'
}