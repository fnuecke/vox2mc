name: publish

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to use"
        required: false
        default: "0.0.0-dryrun"
      publish:
        description: "Publish to the fnuecke/maven repository"
        type: boolean
        default: false

permissions:
  contents: write

env:
  VERSION: ${{ github.event.release.tag_name || inputs.version }}
  SHOULD_PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out vox2mc
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Build with Gradle
        run: ./gradlew build -Psemver="$VERSION"

      - name: Add artifacts to the GitHub release
        if: github.event_name == 'release'
        run: gh release upload "$VERSION" ./build/distributions/*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check out the static Maven repository
        if: env.SHOULD_PUBLISH == 'true'
        uses: actions/checkout@v7
        with:
          repository: fnuecke/maven
          token: ${{ secrets.MAVEN_REPO_TOKEN }}
          path: maven

      - name: Publish to the static Maven repository
        if: env.SHOULD_PUBLISH == 'true'
        run: >-
          ./gradlew publish
          -Psemver="$VERSION"
          -PmavenRepoDir="${{ github.workspace }}/maven"

      - name: Commit and push the static Maven repository
        if: env.SHOULD_PUBLISH == 'true'
        working-directory: maven
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi
          git commit -m "vox2mc $VERSION"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            git pull --rebase
          done
          echo "Failed to push after 5 attempts."
          exit 1
